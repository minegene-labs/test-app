name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  swift:
    uses: minegene-labs/workflows/.github/workflows/swift-ci.yml@v1.0.0
    with:
      scheme: Starter

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci:
    if: always()
    needs: [swift, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '! echo "$RESULTS" | grep -qE "failure|cancelled"'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
