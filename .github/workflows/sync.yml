name: sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'minegene-labs/template-swift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.token.outputs.token }}
          GIT_USERNAME: ${{ steps.token.outputs.app-slug }}[bot]
          GIT_EMAIL: ${{ steps.token.outputs.app-slug }}[bot]@users.noreply.github.com
          COMMIT_PREFIX: "chore(sync):"
          COMMIT_EACH_FILE: false
          PR_LABELS: false
