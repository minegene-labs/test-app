name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    if: github.repository != 'minegene-labs/template-swift'
    uses: minegene-labs/workflows/.github/workflows/release.yml@v1.0.0
    with:
      scheme: Starter
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      app-id: ${{ secrets.SYNC_APP_ID }}
      app-key: ${{ secrets.SYNC_APP_KEY }}
