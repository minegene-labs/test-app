version: 2
updates:
  - package-ecosystem: swift
    directory: /Core
    schedule:
      interval: weekly
    groups:
      swift:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
